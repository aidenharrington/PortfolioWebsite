<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden Harrington - Software Engineer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }
        .logo {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            border: 3px solid white;
            border-radius: 20px;
            padding: 20px;
            display: inline-block;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .subtitle {
            font-size: 1.5rem;
            margin: 0 0 20px 0;
            opacity: 0.9;
        }
        .description {
            font-size: 1.2rem;
            opacity: 0.8;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AH</div>
        <h1>Aiden Harrington</h1>
        <p class="subtitle">Software Engineer</p>
        <p class="description">Passionate about problem-solving, mentoring, and building impactful applications.<br>Based in Vancouver, BC</p>
    </div>
</body>
</html>
